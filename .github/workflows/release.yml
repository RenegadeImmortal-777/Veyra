name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin_src: engine-rs/target/release/veyra
            asset_name: veyra-native-linux-x86_64
          - os: macos-latest
            bin_src: engine-rs/target/release/veyra
            asset_name: veyra-native-macos-arm64
          - os: windows-latest
            bin_src: engine-rs/target/release/veyra.exe
            asset_name: veyra-native-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine-rs
      - name: Build release binary
        working-directory: engine-rs
        run: cargo build --release --locked
      - name: Rename asset
        shell: bash
        run: cp "${{ matrix.bin_src }}" "${{ matrix.asset_name }}"
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
