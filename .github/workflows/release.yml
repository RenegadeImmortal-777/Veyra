name: Veyra Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: veyra-windows-x86_64
            binary: target/release/veyra.exe
          - os: ubuntu-latest
            artifact: veyra-linux-x86_64
            binary: target/release/veyra
          - os: macos-latest
            artifact: veyra-macos-arm64
            binary: target/release/veyra
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Quality gate
        run: cargo fmt --check
      - name: Tests
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Portable core
        run: cargo check --no-default-features
      - name: Release build
        run: cargo build --release
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p ../dist/${{ matrix.artifact }}
          cp ${{ matrix.binary }} ../dist/${{ matrix.artifact }}/
          cp ../README.md ../dist/${{ matrix.artifact }}/
          cp -R ../registry ../packages ../stdlib ../dist/${{ matrix.artifact }}/
      - name: Checksums
        shell: bash
        run: |
          cd ../dist
          if command -v sha256sum >/dev/null 2>&1; then
            find ${{ matrix.artifact }} -type f -exec sha256sum {} \; > ${{ matrix.artifact }}.sha256
          else
            find ${{ matrix.artifact }} -type f -exec shasum -a 256 {} \; > ${{ matrix.artifact }}.sha256
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
