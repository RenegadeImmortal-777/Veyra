name: Veyra CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format check
        working-directory: engine-rs
        run: cargo fmt --check
      - name: Unit tests
        working-directory: engine-rs
        run: cargo test
      - name: Portable core check
        working-directory: engine-rs
        run: cargo check --no-default-features
      - name: Release build
        working-directory: engine-rs
        run: cargo build --release

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy
        working-directory: engine-rs
        run: cargo clippy --all-targets --all-features -- -D warnings

  package-matrix-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release compiler
        working-directory: engine-rs
        run: cargo build --release
      - name: Validate registry packages (Windows)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\scripts\package-matrix.ps1
      - name: Validate ecosystem gate (Windows)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\scripts\ecosystem-gate.ps1

  package-matrix-posix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release compiler
        working-directory: engine-rs
        run: cargo build --release
      - name: Validate registry packages (POSIX)
        run: sh ./scripts/package-matrix.sh
