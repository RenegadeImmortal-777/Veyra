[package]
name = "veyra"
version = "7.0.0"
edition = "2024"

[features]
default = ["native-services"]
native-services = ["dep:reqwest", "dep:rusqlite", "dep:tinyfiledialogs"]

[dependencies]
regex = "1"
serde_json = "1"
rand = "0.8"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
csv = "1"
tiny_http = "0.12"
tinyfiledialogs = { version = "3", optional = true }
libloading = "0.8"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
chrono = "0.4.45"
base64 = "0.23.1"
toml = "1.1.6"
uuid = { version = "1.26.1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
