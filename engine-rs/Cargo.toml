[package]
name = "veyra"
version = "4.0.0"
edition = "2024"

[dependencies]
regex = "1"
serde_json = "1"
rand = "0.8"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
